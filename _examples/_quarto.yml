project:
  type: website
  # Stage the extension from the repository root for the duration of the render,
  # so the example always uses the current code (no committed copy to drift).
  pre-render:
    - rm -rf _extensions
    - cp -R ../_extensions _extensions
  post-render: rm -rf _extensions

website:
  title: "My Website"
  search: false
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  image: index-social-card.png # social card generated by the social-card filter on index.qmd
  page-footer: "Made with ❤️ and Quarto"
  navbar:
    right:
      - text: Home
        href: index.qmd
    tools: 
      - icon: github
        text: Github
        href: https://github.com
