color:
  foreground:
    light: "#1a1a2e"
    dark: "#f5f5f5"
  background:
    light: "#ffffff"
    dark: "#1a1a2e"
  primary:
    light: "#355044" # dark shade of the foggy mint, 8.85:1 on white (WCAG AA)
    dark: "#94b8a8"  # foggy mint, 7.86:1 on the navy (WCAG AA)

typography:
  fonts:
    - family: Fraunces
      source: google
      # request explicit weights: Typst only gets a variable font's default
      # (light) instance, so without this the bold title renders thin
      weight: [400, 700]
    - family: Atkinson Hyperlegible
      source: google
  base:
    family: Atkinson Hyperlegible # designed for legibility
  headings:
    family: Fraunces # soft serif with some personality
  monospace-inline:
    background-color:
      light: "#f1f1f4"
      dark: "#2a2a40"
  monospace-block:
    background-color:
      light: "#f1f1f4"
      dark: "#2a2a40"

defaults:
  bootstrap:
    rules: |
      h2 {
        border: none;
      }
