project:
  type: website
  render:
    - "*.qmd" # only the landing page; keep PLAN.md and README.md out of the site

website:
  title: "quarto-social-card"
  description: "A Quarto Typst format for Open Graph social cards, styled from your _brand.yml."
  open-graph: true
  image: thumbnail.png # this site's own card, generated by the extension (see _thumbnail.qmd)
  image-alt: "quarto-social-card — social cards from your Quarto metadata"
  navbar:
    right:
      - icon: github
        href: https://github.com/cwickham/quarto-social-card
        aria-label: GitHub
  page-footer: "Made with Quarto and quarto-social-card"

format:
  html:
    syntax-highlighting: a11y # light/dark accessible code highlighting
    axe:
      output: document
    theme:
      light: brand
      dark:
        - brand
        - theme-dark.scss # navbar contrast fix for dark mode
